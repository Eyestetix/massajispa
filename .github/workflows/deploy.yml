name: Deploy to Production Hosting (massaji.net)

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Sync Files to Biznet Hosting (massaji.net)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get Latest Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync Files via Explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            **/.DS_Store
            **/__pycache__/**
            *.pyc
            server.py
            compile_complete_site.py
            build_preview.py
            scratch/**
            .system_generated/**
            data/bookings.json
            data/analytics.json
            data/settings.json
            data/menu.json
            data/promo.json
            data/smtp_config.json
            data/mail_log.json
            data/logs/**
            assets/uploads/**
